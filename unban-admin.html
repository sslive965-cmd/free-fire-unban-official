
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXVORA // ADMIN TERMINAL</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--green:#65ff87;--bg:#050906;--panel:#0a130d;--line:#204b2c;--muted:#91ad98;--red:#ff7373}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:#e5ffe9;font:14px monospace}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.12;background:repeating-linear-gradient(0deg,transparent 0 3px,#65ff87 4px)}
main{max-width:1050px;margin:auto;padding:20px}
header{border-bottom:1px solid var(--line);padding:15px 0;margin-bottom:20px}
h1,h2,h3{color:var(--green);letter-spacing:1px}
h1{font-size:clamp(22px,5vw,34px)}
.panel{background:rgba(10,19,13,.96);border:1px solid var(--line);padding:18px;border-radius:8px;margin:15px 0;box-shadow:0 0 18px #0b2913}
input,select,textarea,button{font:inherit;width:100%;padding:12px;margin:6px 0;background:#050906;color:#e5ffe9;border:1px solid #315b3a;border-radius:4px}
button{background:var(--green);color:#061009;font-weight:bold;cursor:pointer}
button:hover{filter:brightness(1.12)}
button:disabled{opacity:.5;cursor:wait}
button.danger{background:var(--red)}
button.secondary{background:#122219;color:var(--green)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tabs button{width:auto;flex:1;min-width:120px}
.item{border:1px solid var(--line);padding:14px;margin:12px 0;border-radius:5px;overflow-wrap:anywhere;white-space:pre-wrap}
.muted{color:var(--muted);font-size:12px}
.status{color:var(--green)}
.hidden{display:none!important}
#log{white-space:pre-wrap;color:var(--green);min-height:20px}
.keytext{font-size:15px;color:var(--green);overflow-wrap:anywhere;user-select:text}
label{display:block;margin-top:10px;color:var(--muted)}
</style>
</head>
<body>
<main>
<header>
  <p class="status">● SYSTEM ONLINE / AUTHORIZED ACCESS ONLY</p>
  <h1>NEXVORA<span class="muted"> // ADMIN TERMINAL</span></h1>
  <p class="muted">LICENSE MANAGEMENT • SUPPORT REQUESTS • SECURITY</p>
</header>

<section id="login" class="panel">
  <h2>&gt; ADMIN AUTHENTICATION</h2>
  <label>Email</label>
  <input id="email" type="email" autocomplete="username" placeholder="Admin email">
  <label>Password</label>
  <input id="password" type="password" autocomplete="current-password" placeholder="Password">
  <button id="loginBtn">[ LOGIN ]</button>
  <p id="loginMsg" role="status"></p>
</section>

<section id="dashboard" class="hidden">
  <div class="panel">
    <p id="adminInfo" class="status"></p>
    <div class="tabs">
      <button data-tab="licenses">LICENSE KEYS</button>
      <button data-tab="requests">SUPPORT REQUESTS</button>
      <button id="logoutBtn" class="secondary">LOG OUT</button>
    </div>
    <p id="log" role="status"></p>
  </div>

  <section id="licenses" class="panel">
    <h2>&gt; GENERATE LICENSE KEYS</h2>
    <p class="muted">Keys are generated by the secured Supabase Edge Function.</p>
    <div class="grid">
      <div>
        <label>Number of keys (1–20)</label>
        <input id="keyCount" type="number" min="1" max="20" value="1">
      </div>
      <div>
        <label>Validity in days (1–3650)</label>
        <input id="keyDays" type="number" min="1" max="3650" value="30">
      </div>
    </div>
    <button id="generateBtn">[ GENERATE KEYS ]</button>
    <div id="generated"></div>
    <hr style="border-color:#204b2c">
    <h2>&gt; STORED LICENSE KEYS</h2>
    <button id="refreshKeys" class="secondary">[ REFRESH KEY LIST ]</button>
    <div id="keys"></div>
  </section>

  <section id="requestsTab" class="panel hidden">
    <h2>&gt; SUPPORT REQUESTS</h2>
    <button id="refreshBtn" class="secondary">[ REFRESH REQUESTS ]</button>
    <div id="requests"></div>
  </section>
</section>
</main>

<script>
const SUPABASE_URL = "https://bxyfphaytgtcodcnszya.supabase.co";
const SUPABASE_KEY = "sb_publishable_qT3bI6MLd-M9nCo2n7aWDg_xxQFhmi6";
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
let currentAdmin = null;

function log(message) {
  $("log").textContent = message;
}

function safeText(tag, text, className) {
  const el = document.createElement(tag);
  el.textContent = text ?? "";
  if (className) el.className = className;
  return el;
}

async function checkAdmin() {
  const { data, error } = await db.auth.getUser();
  if (error || !data.user) return false;

  const result = await db.from("admin_users")
    .select("user_id")
    .eq("user_id", data.user.id)
    .maybeSingle();

  if (result.error || !result.data) return false;

  currentAdmin = data.user;
  return true;
}

async function showDashboard() {
  if (!(await checkAdmin())) {
    currentAdmin = null;
    $("dashboard").classList.add("hidden");
    $("login").classList.remove("hidden");
    $("loginMsg").textContent = "Admin authorization failed.";
    return;
  }

  $("login").classList.add("hidden");
  $("dashboard").classList.remove("hidden");
  $("adminInfo").textContent = "SESSION AUTHORIZED: " + currentAdmin.email;
  await loadKeys();
  await loadRequests();
}

async function callLicense(action, extra = {}) {
  const { data: { session } } = await db.auth.getSession();

  if (!session?.access_token) {
    throw Error("Please sign in again.");
  }

  const response = await fetch(
    SUPABASE_URL + "/functions/v1/manage-license",
    {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + session.access_token
      },
      body: JSON.stringify({ action, ...extra })
    }
  );

  const result = await response.json().catch(() => ({}));

  if (!response.ok || result.error) {
    throw Error(result.error || "License request failed.");
  }

  return result;
}

/* COPY BUTTON: use Clipboard API, with a fallback for browsers
   where clipboard access is unavailable. */
async function copyKey(value) {
  if (!value) {
    log("No key value available to copy.");
    return;
  }

  try {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(value);
      log("Key copied successfully.");
      return;
    }
  } catch (_) {}

  const area = document.createElement("textarea");
  area.value = value;
  area.setAttribute("readonly", "");
  area.style.position = "fixed";
  area.style.left = "-9999px";
  document.body.appendChild(area);
  area.select();

  let copied = false;
  try {
    copied = document.execCommand("copy");
  } catch (_) {}

  area.remove();
  log(copied
    ? "Key copied successfully."
    : "Copy failed. Select and copy the displayed key manually.");
}

/* Accept the actual database field license_key.
   Also tolerate key for compatibility with older responses. */
function getKeyValue(item) {
  if (typeof item === "string") return item;
  return item?.license_key || item?.key || "";
}

function addKeyCard(container, item, showId = false) {
  const card = document.createElement("article");
  card.className = "item";

  const value = getKeyValue(item);

  if (showId) {
    card.appendChild(safeText("h3", "KEY #" + item.id));
  }

  card.appendChild(
    safeText("div", value || "[key value missing in response]", "keytext")
  );

  if (value) {
    const copy = document.createElement("button");
    copy.textContent = "[ COPY KEY ]";
    copy.onclick = () => copyKey(value);
    card.appendChild(copy);
  }

  if (showId) {
    card.appendChild(safeText("div", "Status: " + (item.status || "unknown")));

    if (item.expires_at) {
      card.appendChild(safeText(
        "div",
        "Expires: " + new Date(item.expires_at).toLocaleString()
      ));
    }

    if (item.status === "active") {
      const revoke = document.createElement("button");
      revoke.className = "danger";
      revoke.textContent = "[ REVOKE KEY ]";

      revoke.onclick = async () => {
        if (!confirm("Revoke this key? This cannot be undone here.")) return;

        revoke.disabled = true;
        try {
          await callLicense("revoke", { id: item.id });
          log("Key revoked.");
          await loadKeys();
        } catch (e) {
          log("ERROR: " + e.message);
          revoke.disabled = false;
        }
      };

      card.appendChild(revoke);
    }
  }

  container.appendChild(card);
}

$("loginBtn").onclick = async () => {
  const email = $("email").value.trim();
  const password = $("password").value;

  if (!email || !password) {
    $("loginMsg").textContent = "Enter email and password.";
    return;
  }

  $("loginBtn").disabled = true;
  $("loginMsg").textContent = "Authenticating...";

  try {
    const { error } = await db.auth.signInWithPassword({ email, password });

    if (error) {
      $("loginMsg").textContent = "Login failed. Check your credentials.";
      return;
    }

    await showDashboard();
  } catch (_) {
    $("loginMsg").textContent = "Login failed. Please try again.";
  } finally {
    $("loginBtn").disabled = false;
  }
};

document.querySelectorAll("[data-tab]").forEach(button => {
  button.onclick = () => {
    const license = button.dataset.tab === "licenses";
    $("licenses").classList.toggle("hidden", !license);
    $("requestsTab").classList.toggle("hidden", license);
    log(license ? "LICENSE MANAGEMENT" : "SUPPORT REQUESTS");
  };
});

$("generateBtn").onclick = async () => {
  const count = Number($("keyCount").value);
  const days = Number($("keyDays").value);

  if (
    !Number.isInteger(count) || count < 1 || count > 20 ||
    !Number.isInteger(days) || days < 1 || days > 3650
  ) {
    log("ERROR: Choose 1–20 keys and 1–3650 days.");
    return;
  }

  $("generateBtn").disabled = true;
  $("generated").replaceChildren();
  log("Generating license keys...");

  try {
    const result = await callLicense("generate", { count, days });
    const keys = Array.isArray(result.keys) ? result.keys : [];

    if (!keys.length) {
      $("generated").appendChild(safeText(
        "p",
        "No key values were returned by the server. Check the function response."
      ));
      log("No keys returned. Refresh the stored key list.");
    } else {
      $("generated").appendChild(safeText("h3", "// GENERATED KEYS"));
      keys.forEach(item => addKeyCard($("generated"), item, false));
      log("Generated " + keys.length + " key(s). Use COPY KEY to copy.");
    }

    await loadKeys();
  } catch (e) {
    log("ERROR: " + e.message);
  } finally {
    $("generateBtn").disabled = false;
  }
};

$("refreshKeys").onclick = loadKeys;

async function loadKeys() {
  $("keys").replaceChildren();

  try {
    log("Loading stored keys...");
    const result = await callLicense("list");
    const list = Array.isArray(result.keys) ? result.keys : [];

    if (!list.length) {
      $("keys").appendChild(safeText("p", "No license keys found.", "muted"));
    } else {
      list.forEach(item => addKeyCard($("keys"), item, true));
    }

    log("Key list refreshed.");
  } catch (e) {
    log("ERROR loading keys: " + e.message);
  }
}

async function loadRequests() {
  if (!(await checkAdmin())) {
    log("Admin authorization required.");
    return;
  }

  $("requests").replaceChildren();

  const { data, error } = await db.from("support_requests")
    .select("id,message,status,created_at,customer_telegram_id,customer_username,admin_reply")
    .order("created_at", { ascending: false })
    .limit(100);

  if (error) {
    log("Could not load requests. Check database policies.");
    return;
  }

  if (!data.length) {
    $("requests").appendChild(safeText("p", "No requests yet.", "muted"));
    return;
  }

  data.forEach(item => {
    const card = document.createElement("article");
    card.className = "item";

    card.appendChild(safeText("h3", "REQUEST #" + item.id));
    card.appendChild(safeText(
      "p",
      "Customer: " + (item.customer_username || "unknown") +
      "\nTelegram ID: " + (item.customer_telegram_id || "not provided") +
      "\nDate: " + new Date(item.created_at).toLocaleString()
    ));
    card.appendChild(safeText("p", item.message || ""));

    const select = document.createElement("select");
    ["pending", "in_progress", "resolved", "declined"].forEach(value => {
      const option = document.createElement("option");
      option.value = value;
      option.textContent = value;
      select.appendChild(option);
    });
    select.value = item.status || "pending";

    const reply = document.createElement("textarea");
    reply.placeholder = "Optional admin reply";
    reply.value = item.admin_reply || "";

    const update = document.createElement("button");
    update.textContent = "[ UPDATE REQUEST ]";
    update.onclick = async () => {
      const { error } = await db.from("support_requests").update({
        status: select.value,
        admin_reply: reply.value.trim(),
        updated_at: new Date().toISOString()
      }).eq("id", item.id);

      log(error ? "Request update failed." : "Request updated.");
      if (!error) await loadRequests();
    };

    const remove = document.createElement("button");
    remove.className = "danger";
    remove.textContent = "[ DELETE REQUEST ]";
    remove.onclick = async () => {
      if (!confirm("Permanently delete request #" + item.id + "?")) return;

      const { error } = await db.from("support_requests")
        .delete().eq("id", item.id);

      log(error ? "Delete failed." : "Request deleted.");
      if (!error) await loadRequests();
    };

    card.append(select, reply, update, remove);
    $("requests").appendChild(card);
  });
}

$("refreshBtn").onclick = loadRequests;

$("logoutBtn").onclick = async () => {
  await db.auth.signOut();
  currentAdmin = null;
  $("dashboard").classList.add("hidden");
  $("login").classList.remove("hidden");
  $("requests").replaceChildren();
  $("keys").replaceChildren();
  $("generated").replaceChildren();
  $("loginMsg").textContent = "";
  log("Logged out.");
};

db.auth.getSession().then(async ({ data }) => {
  if (data.session) await showDashboard();
});
</script>
</body>
</html>
